[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apna-ai-coach"
version = "0.1.0"
description = "Real-time AI gym coach in-browser using MediaPipe, Streamlit, Groq, Whisper, and gTTS"
authors = [{ name = "Prathamesh Shimpi" }]
readme = "README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501", "E402"]
